# Validate and commit coordinated source metadata only; never tag or build.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate, bump & push selected branch
        id: bump
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/release_lifecycle.py bump "$MODE"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "### Source version bumped to ${VERSION}. No tag or Build was started. Run Build manually on the selected branch when ready." >> "$GITHUB_STEP_SUMMARY"
